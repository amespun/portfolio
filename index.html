<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aïda Martínez Espún · Homepage directions</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Shared */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.variant{display:none}
.variant[data-on]{display:block}
.wrap{width:min(1200px,100% - 48px);margin-inline:auto}
@media (max-width:600px){.wrap{width:calc(100% - 32px)}}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:4px}

/* ============ A · INDEX — precise, text-led, Swiss ============ */
.v-index{
  --bg:#fbfbfa;--ink:#141414;--ink-2:#5c5c5a;--line:#e6e5e1;--accent:#5b3fd6;--soft:#efecfb;
  --display:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
  background:var(--bg);color:var(--ink);font-family:var(--display);min-height:100vh;padding-bottom:120px}
.v-index ::selection{background:var(--accent);color:#fff}
.v-index .nav{display:flex;justify-content:space-between;align-items:center;padding:28px 0}
.v-index .nav .me{display:flex;gap:12px;align-items:center;font-weight:600;text-decoration:none}
.v-index .nav .me img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.v-index .nav ul{display:flex;gap:28px;font-size:15px}
.v-index .nav a{text-decoration:none;color:var(--ink-2)}
.v-index .nav a:hover{color:var(--ink)}
.v-index .hero{padding:96px 0 72px;display:grid;grid-template-columns:1fr;gap:40px}
.v-index .hero h1{font-size:clamp(2.4rem,5.4vw,4.5rem);font-weight:600;letter-spacing:-.035em;line-height:1.02;max-width:16ch;text-wrap:balance}
.v-index .hero h1 em{font-style:normal;color:var(--accent)}
.v-index .hero p{font-size:clamp(1.05rem,1.4vw,1.25rem);line-height:1.55;color:var(--ink-2);max-width:56ch}
.v-index .facts{display:flex;flex-wrap:wrap;gap:8px 28px;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.v-index .facts b{color:var(--ink);font-weight:500}
.v-index .co{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;display:flex;flex-wrap:wrap;gap:12px 40px;align-items:baseline}
.v-index .co span:first-child{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.v-index .co span{font-size:18px;font-weight:500;letter-spacing:-.01em}
.v-index h2{font-size:14px;font-family:var(--mono);font-weight:500;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin:96px 0 20px}
.v-index .rows{border-top:1px solid var(--ink)}
.v-index .row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr) 24px;gap:32px;align-items:start;padding:28px 0;border-bottom:1px solid var(--line);text-decoration:none;position:relative}
.v-index .row h3{font-size:clamp(1.25rem,2vw,1.6rem);font-weight:600;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.v-index .row .meta{font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--ink-2)}
.v-index .row .meta b{display:block;color:var(--ink);font-weight:500}
.v-index .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.v-index .kpi strong{display:block;font-size:clamp(1.3rem,2vw,1.7rem);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--accent)}
.v-index .kpi span{font-size:13px;color:var(--ink-2);line-height:1.35;display:block;margin-top:4px}
.v-index .kpi.text strong{font-size:1rem;letter-spacing:-.01em;line-height:1.3;color:var(--ink)}
.v-index .arrow{font-size:20px;transition:transform .25s cubic-bezier(.23,1,.32,1)}
.v-index .peek{position:absolute;right:48px;top:50%;width:300px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;opacity:0;transform:translateY(-50%) scale(.96) rotate(-2deg);transition:opacity .2s ease,transform .3s cubic-bezier(.23,1,.32,1);pointer-events:none;box-shadow:0 20px 40px -16px rgba(20,20,20,.35);z-index:2}
@media (hover:hover) and (pointer:fine){
  .v-index .row:hover .peek{opacity:1;transform:translateY(-50%) scale(1) rotate(-2deg)}
  .v-index .row:hover .arrow{transform:translateX(4px)}
  .v-index .row:hover h3{color:var(--accent)}
}
.v-index .earlier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.v-index .earlier a{text-decoration:none;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px}
.v-index .earlier b{font-weight:600}
.v-index .earlier span{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.v-index .beyond{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.v-index .beyond div{display:grid;gap:8px;align-content:start}
.v-index .beyond b{font-weight:600;font-size:17px}
.v-index .beyond p{color:var(--ink-2);font-size:15px;line-height:1.5}
.v-index .about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:56px;align-items:start}
.v-index .about img{border-radius:12px;aspect-ratio:4/5;object-fit:cover;width:100%;max-width:420px}
.v-index .about p{font-size:1.1rem;line-height:1.6;color:var(--ink-2);max-width:56ch}
.v-index .about p + p{margin-top:16px}
.v-index blockquote{margin:36px 0 0;padding:24px;background:var(--soft);border-radius:12px;font-size:1.15rem;line-height:1.5;font-weight:500;letter-spacing:-.01em}
.v-index blockquote footer{margin-top:12px;font-family:var(--mono);font-size:13px;color:var(--ink-2);font-weight:400}
.v-index .contact{margin-top:120px;border-top:1px solid var(--ink);padding-top:40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:end}
.v-index .contact h2{margin:0;font-family:var(--display);font-size:clamp(2rem,4vw,3.2rem);color:var(--ink);text-transform:none;letter-spacing:-.03em;font-weight:600}
.v-index .contact ul{display:flex;flex-wrap:wrap;gap:12px 28px;font-family:var(--mono);font-size:14px}
@media (max-width:900px){
  .v-index .row{grid-template-columns:1fr;gap:16px}
  .v-index .arrow,.v-index .peek{display:none}
  .v-index .beyond{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v-index .about{grid-template-columns:1fr}
  .v-index .earlier{grid-template-columns:1fr}
}
@media (max-width:600px){.v-index .nav .me span{display:none}.v-index .co span:first-child{width:100%}.v-index .nav ul{gap:16px;font-size:14px}.v-index .beyond{grid-template-columns:1fr}.v-index .hero{padding-top:56px}}

/* ============ B · GALLERY — evolution of today's site, image-led, warm ============ */
.v-gallery{
  --bg:#ffffff;--ink:#1a1a1a;--ink-2:#62605c;--line:#ecebe8;--tile:#f4f2ee;--accent:#cdbcf2;--accent-ink:#3d2a8a;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;padding-bottom:120px}
.v-gallery ::selection{background:var(--accent);color:var(--ink)}
.v-gallery .nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}
.v-gallery .nav .me img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.v-gallery .nav ul{display:flex;gap:28px;font-weight:500;font-size:15px}
.v-gallery .nav a{text-decoration:none}
.v-gallery .hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center;padding:64px 0 56px}
.v-gallery h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,5.6vw,4.8rem);line-height:.98;letter-spacing:-.035em;text-wrap:balance}
.v-gallery .hero p{margin-top:24px;font-size:1.15rem;line-height:1.55;color:var(--ink-2);max-width:48ch}
.v-gallery .pill{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:10px 16px;background:var(--tile);border-radius:999px;font-size:14px;font-weight:500}
.v-gallery .pill i{width:8px;height:8px;border-radius:50%;background:#2fa36b;display:block}
.v-gallery .stack img{width:100%;height:auto}
.v-gallery .co{display:flex;flex-wrap:wrap;gap:10px;padding:8px 0 0}
.v-gallery .co span{padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:15px}
.v-gallery .head{display:flex;justify-content:space-between;align-items:end;margin:104px 0 28px;gap:16px}
.v-gallery h2{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,3vw,2.6rem);letter-spacing:-.03em}
.v-gallery .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 32px}
.v-gallery .card{text-decoration:none;display:grid;gap:18px}
.v-gallery .card .img{border-radius:18px;overflow:hidden;background:var(--tile);aspect-ratio:4/3}
.v-gallery .card img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.23,1,.32,1)}
@media (hover:hover) and (pointer:fine){.v-gallery .card:hover img{transform:scale(1.03)}}
.v-gallery .tags{display:flex;flex-wrap:wrap;gap:8px}
.v-gallery .tags span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--tile)}
.v-gallery .tags span:first-child{background:var(--accent);color:var(--accent-ink)}
.v-gallery .card h3{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.v-gallery .card .co-name{color:var(--ink-2);font-weight:500}
.v-gallery .kpis{display:flex;flex-wrap:wrap;gap:8px 28px;border-top:1px solid var(--line);padding-top:14px}
.v-gallery .kpi{font-size:14px;color:var(--ink-2)}
.v-gallery .kpi strong{font-family:var(--display);font-size:1.3rem;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:6px;letter-spacing:-.02em}
.v-gallery .earlier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.v-gallery .earlier a{text-decoration:none;display:grid;gap:12px}
.v-gallery .earlier .img{border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:var(--tile)}
.v-gallery .earlier img{width:100%;height:100%;object-fit:cover}
.v-gallery .earlier b{font-family:var(--display);font-size:1.15rem}
.v-gallery .earlier span{color:var(--ink-2);font-size:14px}
.v-gallery .beyond{background:var(--tile);border-radius:24px;padding:48px;margin-top:104px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:48px}
.v-gallery .beyond h2{margin:0}
.v-gallery .beyond>p{color:var(--ink-2);margin-top:12px;line-height:1.55}
.v-gallery .beyond ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.v-gallery .beyond b{font-family:var(--display);font-size:1.15rem;display:block;margin-bottom:6px}
.v-gallery .beyond li p{color:var(--ink-2);line-height:1.5;font-size:15px}
.v-gallery .about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;align-items:center;margin-top:104px}
.v-gallery .about img{border-radius:20px;aspect-ratio:4/5;object-fit:cover;width:100%}
.v-gallery .about p{font-size:1.1rem;line-height:1.6;color:var(--ink-2);margin-top:16px;max-width:54ch}
.v-gallery blockquote{margin:32px 0 0;font-family:var(--display);font-size:1.35rem;line-height:1.35;font-weight:500;letter-spacing:-.015em}
.v-gallery blockquote footer{font-family:var(--body);font-size:14px;color:var(--ink-2);margin-top:10px}
.v-gallery .contact{margin-top:104px;background:var(--ink);color:#fff;border-radius:24px;padding:56px 48px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:center}
.v-gallery .contact h2{color:#fff}
.v-gallery .contact a{display:inline-block;padding:14px 22px;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;font-weight:600;transition:transform .16s ease-out}
.v-gallery .contact a:active{transform:scale(.97)}
.v-gallery .contact a + a{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);margin-left:8px}
@media (max-width:900px){
  .v-gallery .hero,.v-gallery .about,.v-gallery .beyond{grid-template-columns:1fr}
  .v-gallery .grid{grid-template-columns:1fr}
  .v-gallery .earlier{grid-template-columns:1fr}
}
@media (max-width:600px){.v-gallery .beyond{padding:28px}.v-gallery .beyond ul{grid-template-columns:1fr}.v-gallery .contact{padding:36px 28px}.v-gallery .nav ul{gap:16px;font-size:14px}}

/* ============ C · SPLIT — committed colour panel, sticky identity ============ */
.v-split{
  --panel:#2b1d6b;--panel-ink:#f3efff;--panel-2:#b9acec;--bg:#f7f6f3;--ink:#17151f;--ink-2:#5f5b6b;--line:#e4e1ea;--accent:#c9f26b;
  --display:"Schibsted Grotesk",system-ui,sans-serif;
  font-family:var(--display);background:var(--bg);color:var(--ink);min-height:100vh}
.v-split ::selection{background:var(--accent);color:var(--panel)}
.v-split .layout{display:grid;grid-template-columns:minmax(340px,38%) minmax(0,1fr)}
.v-split aside{background:var(--panel);color:var(--panel-ink);position:sticky;top:0;height:100vh;padding:40px 44px;display:flex;flex-direction:column;justify-content:space-between;overflow:auto}
.v-split aside .me{display:flex;gap:14px;align-items:center}
.v-split aside .me img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.v-split aside .me b{font-weight:700;font-size:17px;display:block}
.v-split aside .me span{color:var(--panel-2);font-size:14px}
.v-split aside h1{font-weight:800;font-size:clamp(2rem,3.2vw,3.1rem);line-height:1.02;letter-spacing:-.035em;margin:48px 0 20px;text-wrap:balance}
.v-split aside h1 em{font-style:normal;color:var(--accent)}
.v-split aside p{color:var(--panel-2);line-height:1.55;font-size:1.02rem;max-width:42ch}
.v-split aside .co{margin-top:28px;display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:700;font-size:15px}
.v-split aside .co span:first-child{width:100%;color:var(--panel-2);font-weight:400;font-size:13px}
.v-split aside nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.v-split aside nav a{padding:9px 14px;border-radius:999px;border:1px solid rgba(243,239,255,.25);text-decoration:none;font-size:14px;font-weight:500;transition:background .2s ease}
@media (hover:hover) and (pointer:fine){.v-split aside nav a:hover{background:rgba(243,239,255,.1)}}
.v-split aside nav a.cta{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.v-split main{padding:40px 48px 120px}
.v-split h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:500;margin:72px 0 20px}
.v-split h2:first-child{margin-top:8px}
.v-split .case{display:grid;gap:20px;text-decoration:none;padding-bottom:40px;margin-bottom:40px;border-bottom:1px solid var(--line)}
.v-split .case .img{border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:var(--line)}
.v-split .case img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.23,1,.32,1)}
@media (hover:hover) and (pointer:fine){.v-split .case:hover img{transform:scale(1.025)}}
.v-split .case .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.v-split .case h3{font-weight:800;font-size:clamp(1.5rem,2.4vw,2.1rem);letter-spacing:-.03em;line-height:1.08;text-wrap:balance;max-width:24ch}
.v-split .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.v-split .kpi{border-left:1px solid var(--line);padding-left:14px}
.v-split .kpi strong{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.v-split .kpi span{font-size:13.5px;color:var(--ink-2);line-height:1.35}
.v-split .kpi.text strong{font-size:1.05rem;letter-spacing:-.01em;line-height:1.25}
.v-split .earlier{display:grid;gap:0}
.v-split .earlier a{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:700}
.v-split .earlier span{font-weight:400;color:var(--ink-2);font-size:14px;text-align:right}
.v-split .beyond{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px}
.v-split .beyond b{font-size:1.1rem;font-weight:800;display:block;margin-bottom:6px}
.v-split .beyond p{color:var(--ink-2);line-height:1.5;font-size:15px}
.v-split blockquote{margin:0;background:#fff;border-radius:14px;padding:28px;font-size:1.25rem;line-height:1.4;font-weight:500;letter-spacing:-.01em}
.v-split blockquote footer{font-size:14px;color:var(--ink-2);margin-top:12px;font-weight:400}
.v-split .aboutrow{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start;margin-bottom:24px}
.v-split .aboutrow img{border-radius:12px;aspect-ratio:4/5;object-fit:cover}
.v-split .aboutrow p{color:var(--ink-2);line-height:1.6;font-size:1.05rem}
@media (max-width:960px){
  .v-split .layout{grid-template-columns:1fr}
  .v-split aside{position:static;height:auto;padding:32px 24px 40px}
  .v-split main{padding:24px 24px 120px}
  .v-split .beyond{grid-template-columns:1fr}
}
@media (max-width:600px){.v-split .kpis{grid-template-columns:1fr 1fr}.v-split .aboutrow{grid-template-columns:1fr}.v-split .aboutrow img{max-width:220px}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Picker: harness chrome, verbatim spec */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{white-space:nowrap;position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Homepage directions">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">1 · Index</button>
  <button class="proto-picker-item">2 · Gallery</button>
  <button class="proto-picker-item">3 · Split</button>
</nav>

<script>
const SQ = 'https://images.squarespace-cdn.com/content/v1/6702bf4ad824953000041187/';
const img = (id, w = 1500) => SQ + id + '?format=' + w + 'w';
const OLD = 'https://www.amespun.com/work/';

const ME = {
  avatar: img('c452157e-0501-4f67-b013-13ce41e854d4/Ellipse+26_.png', 300),
  portrait: img('414dfdcf-4e3c-4d4b-b59a-3cc3c60f750d/IMG_5346.jpeg', 1000),
  devices: img('3df60a90-7ab0-4d16-8395-9a4751061c20/Group+112596.png', 1500),
  email: 'amespun@gmail.com',

const variants = [vIndex, vGallery, vSplit];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) { stage.innerHTML = variants[i](); window.scrollTo(0, 0); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
});
document.fonts.ready.then(moveHighlight);
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
