name: Reference screenshots
on:
  push:
    branches: [shots]
    paths: ['.github/workflows/shots.yml']
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - name: Shoot
        run: |
          mkdir -p _ref
          cat > shoot.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const b = await chromium.launch();
          const url = 'https://labbcreativestudio.nl/';
          for (const [n, ctx] of [['d', { viewport: { width: 1440, height: 900 } }], ['m', devices['iPhone 13']]]) {
            const c = await b.newContext(ctx); const p = await c.newPage();
            await p.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await p.waitForTimeout(2500);
            const H = await p.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y < H; y += 700) { await p.evaluate(y => scrollTo(0, y), y); await p.waitForTimeout(350); }
            await p.evaluate(() => scrollTo(0, 0)); await p.waitForTimeout(800);
            await p.screenshot({ path: `_ref/${n}-top.png` });
            await p.screenshot({ path: `_ref/${n}-full.png`, fullPage: true });
            if (n === 'd') {
              const info = await p.evaluate(() => {
                const cs = el => el ? getComputedStyle(el) : null;
                const pick = s => { const e = document.querySelector(s); const c = cs(e); return c && { font: c.fontFamily, size: c.fontSize, weight: c.fontWeight, ls: c.letterSpacing, lh: c.lineHeight, color: c.color, tt: c.textTransform }; };
                const fonts = [...new Set([...document.querySelectorAll('*')].map(e => getComputedStyle(e).fontFamily))].slice(0, 12);
                const bgs = {}; [...document.querySelectorAll('section, div, body, footer')].forEach(e => { const b = getComputedStyle(e).backgroundColor; if (b && b !== 'rgba(0, 0, 0, 0)') bgs[b] = (bgs[b] || 0) + 1; });
                const cols = {}; [...document.querySelectorAll('h1,h2,h3,p,a,span')].forEach(e => { const c = getComputedStyle(e).color; cols[c] = (cols[c] || 0) + 1; });
                return { fonts, h1: pick('h1'), h2: pick('h2'), h3: pick('h3'), p: pick('p'), bgs, cols, cursor: getComputedStyle(document.body).cursor };
              });
              (await import('fs')).writeFileSync('_ref/info.json', JSON.stringify(info, null, 1));
            }
            await c.close();
          }
          await b.close();
          JS
          node shoot.mjs
          ls -la _ref
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add _ref && git commit -m "Reference screenshots" && git push
