name: Fetch Elisava logo
on:
  push:
    paths: ['.github/workflows/elisava.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _icons
          curl -sSL -A "amespun-portfolio/1.0 (amespun@gmail.com)" "https://commons.wikimedia.org/wiki/Special:FilePath/Logo_Elisava_vertical.jpg?width=400" -o _icons/elisava-vertical.jpg
          file _icons/*
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add _icons && git commit -m "Fetched Elisava logo" && git push
