name: Fetch profile assets
on:
  push:
    branches: [shots]
    paths: ['.github/workflows/icons.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 .github/scripts/logos.py
          ls -la _leo/logos
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add _leo && git commit -m "Fetched wordmark logos" && git push
