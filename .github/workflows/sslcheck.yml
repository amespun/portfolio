name: SSL check
on:
  push:
    paths: ['.github/workflows/sslcheck.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in amespun.com www.amespun.com; do
            echo "== $h"; dig +short A $h; dig +short CNAME $h; dig +short AAAA $h
          done
          for u in http://amespun.com https://amespun.com http://www.amespun.com https://www.amespun.com https://www.amespun.com/about/; do
            echo "== $u"; curl -sS -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "$u" || echo FAIL
          done
          echo | openssl s_client -connect amespun.com:443 -servername amespun.com 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName -dates || true
          echo | openssl s_client -connect www.amespun.com:443 -servername www.amespun.com 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName -dates || true
